[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"

# /fotos pasó a llamarse /imagenes (9-oct-2026): los enlaces viejos siguen sirviendo
[[redirects]]
  from = "/fotos"
  to = "/imagenes"
  status = 301

# La escritura se mudó a Substack, Alguien a quien escribir (26-oct-2026): cada texto, al salir allá,
# redirige desde aquí. `force` porque la página sigue existiendo en el sitio.
[[redirects]]
  from = "/carta-a-mi-perro"
  to = "https://aquienescribir.substack.com/p/carta-a-mi-perro"
  status = 301
  force = true

[[redirects]]
  from = "/limones"
  to = "https://aquienescribir.substack.com/p/limones"
  status = 301
  force = true

# Fuera de internet, «por ahora» (vic, 30-oct-2026): todo lo demás lleva a Alguien a quien escribir.
# 302 porque es temporal. Para volver, se borra este bloque. Va después de los dos de arriba, que
# mandan cada texto a su post, y antes de todo lo demás: gana la primera regla que coincide.
[[redirects]]
  from = "/*"
  to = "https://aquienescribir.substack.com/"
  status = 302
  force = true

# Redirects for Astro static assets
[[redirects]]
  from = "/_astro/*"
  to = "/_astro/:splat"
  status = 200

# Enable Brotli Compression
[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = true
  minify = true
[build.processing.js]
  bundle = true
  minify = true
[build.processing.html]
  pretty_urls = true

# Global headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), fullscreen=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; font-src 'self' data: https:; frame-src https: player.bilibili.com; connect-src 'self' https:; object-src 'none'; worker-src 'self' blob:; child-src 'self' blob: player.bilibili.com;"

# HTML pages
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=172800"
    Vary = "Accept-Encoding"

# Blog posts
[[headers]]
  for = "/*/"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=172800"
    Vary = "Accept-Encoding"

# Homepage
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=1800, s-maxage=3600"
    Vary = "Accept-Encoding"

# Static assets
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

# Images
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"







